<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анализ обращений ЦОН</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f6f4; --surface:#ffffff; --surface-2:#f0efec; --border:#e2e1dc; --grid:#ebeae6;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7974;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --s-ethics:#eb6834; --s-standard:#2a78d6; --s-system:#1baf7a; --prev:#a3a29c;
  --good:#0a7d32; --good-soft:#e2f4e7; --bad:#c92a2a; --bad-soft:#fbe5e5; --warn:#9a5800; --warn-soft:#fdf0d8;
  --mark:#ffe08a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#262624; --border:#34342f; --grid:#2a2a27;
    --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8e86;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1c2c42;
    --s-ethics:#d95926; --s-standard:#3987e5; --s-system:#199e70; --prev:#6b6a64;
    --good:#4cc26f; --good-soft:#163020; --bad:#ff7070; --bad-soft:#3a1a1a; --warn:#e8a838; --warn-soft:#352812;
    --mark:#6b5300;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#262624; --border:#34342f; --grid:#2a2a27;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8e86;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1c2c42;
  --s-ethics:#d95926; --s-standard:#3987e5; --s-system:#199e70; --prev:#6b6a64;
  --good:#4cc26f; --good-soft:#163020; --bad:#ff7070; --bad-soft:#3a1a1a; --warn:#e8a838; --warn-soft:#352812;
  --mark:#6b5300;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
button,select,input,textarea{font:inherit;color:inherit}
h1{font-size:18px;margin:0}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 8px;color:var(--text-2);font-weight:600}
a{color:var(--accent)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar .sub{color:var(--muted);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:end;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
select,input[type=text],input[type=search],input[type=number],textarea{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
textarea{width:100%;resize:vertical}
.tabs{display:flex;gap:2px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
main{padding:20px;max-width:1400px;margin:0 auto}
.tab{display:none}
.tab.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.grid2 > .card{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi .k-label{color:var(--text-2);font-size:12px}
.kpi .k-val{font-size:26px;font-weight:650;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .k-val small{font-size:14px;color:var(--muted);font-weight:500}
.delta{font-size:12px;font-variant-numeric:tabular-nums}
.delta.up-bad,.delta.down-bad{color:var(--bad)}
.delta.down-good,.delta.up-good{color:var(--good)}
.delta.neutral{color:var(--muted)}
.note{color:var(--muted);font-size:12px}
.warnbox{background:var(--warn-soft);border:1px solid var(--warn);color:var(--text);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.errbox{background:var(--bad-soft);border:1px solid var(--bad);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.infobox{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:0 0 16px;font-size:13px}
.empty{color:var(--muted);padding:24px;text-align:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;background:var(--surface)}
th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--text-2);position:sticky;top:0;white-space:nowrap}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;white-space:nowrap;border:1px solid transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.badge.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.badge.muted{background:var(--surface-2);color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;margin:1px 2px 1px 0;border-radius:10px;font-size:11px;background:var(--surface-2);color:var(--text);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.g-ethics{background:var(--s-ethics)} .g-standard{background:var(--s-standard)} .g-system{background:var(--s-system)} .g-overdue{background:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.line{height:2px;width:16px;border-radius:0}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--text-2);font-size:12px}
svg.chart text.val{fill:var(--text);font-variant-numeric:tabular-nums}
svg.chart .axis{fill:var(--muted);font-size:11px}
svg.chart .gridline{stroke:var(--grid);stroke-width:1}
svg.chart .hit{fill:transparent}
svg.chart g.bar-row:hover .hit,svg.chart rect.day-hit:hover{fill:var(--surface-2)}
svg.chart g[data-click]{cursor:pointer}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.drop{border:2px dashed var(--border);border-radius:12px;padding:28px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.filecard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin:12px 0}
.filecard header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.filecard header b{font-size:15px;word-break:break-all}
.filecard .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:8px}
.filecard .opts{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.filecard .opts label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.maptable td{padding:4px 8px}
.maptable select{max-width:260px}
.sample{color:var(--muted);font-size:12px;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req{font-size:11px;color:var(--muted)}
.req.r1{color:var(--bad)} .req.r2{color:var(--warn)}
.txt{max-width:520px}
.txt.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.recs td[contenteditable]{min-width:120px}
.recs td[contenteditable]:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
.recs td.wide{min-width:240px}
.settings td{padding:5px 6px}
.settings input[type=text]{width:100%;min-width:120px}
.settings input[type=number]{width:64px}
.settings textarea{min-width:220px;font-size:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50}
#modal.open{display:flex}
#modal .box{background:var(--surface);border-radius:12px;width:min(1100px,100%);max-height:92vh;display:flex;flex-direction:column;border:1px solid var(--border)}
#modal .box header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
#modal .box .body{overflow:auto;padding:12px 16px}
.appeal{border-bottom:1px solid var(--border);padding:10px 0}
.appeal .a-meta{font-size:12px;color:var(--text-2);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
#tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;z-index:60;display:none;max-width:320px;white-space:pre-line}
.print-only{display:none}
.print-header{display:none}
@media (max-width:700px){ main{padding:12px 16px} .topbar,.filters{padding-left:16px;padding-right:16px} }
@media print{
  :root,:root[data-theme="dark"]{color-scheme:light;
    --bg:#fff; --surface:#fff; --surface-2:#f0efec; --border:#d0cfca; --grid:#e5e4e0;
    --text:#000; --text-2:#3a3936; --muted:#6a6964; --accent:#2a78d6;
    --s-ethics:#eb6834; --s-standard:#2a78d6; --s-system:#1baf7a; --prev:#a3a29c;
    --good:#0a7d32; --good-soft:#e2f4e7; --bad:#c92a2a; --bad-soft:#fbe5e5; --warn:#9a5800; --warn-soft:#fdf0d8; --mark:#ffe08a;}
  body{background:#fff;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .topbar,.filters,.tabs,.no-print,#modal,#tip{display:none !important}
  main{padding:0;max-width:none}
  .tab{display:none !important}
  .tab.printable{display:block !important;break-before:page}
  .tab.printable.first-print{break-before:auto}
  .print-header{display:block;margin-bottom:12px;border-bottom:2px solid #000;padding-bottom:6px}
  .print-only{display:inline}
  .card,.kpi,.filecard{break-inside:avoid;border-color:#ccc}
  .table-wrap{overflow:visible;border:0}
  th{position:static}
  tr{break-inside:avoid}
  .txt.clamp{-webkit-line-clamp:unset;display:block}
}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>Анализ обращений граждан по ЦОН</h1>
    <div class="sub">e-Otinish и Единый контакт-центр 1414 · данные обрабатываются только в этом браузере</div>
  </div>
  <div class="toolbar" style="margin:0">
    <button class="btn" id="btnDemo" title="Загрузить синтетические данные за два месяца для ознакомления">Демо-данные</button>
    <button class="btn primary" id="btnPrint">Печать / PDF</button>
  </div>
</div>
<div class="filters" id="filters">
  <label>Месяц<select id="fMonth"></select></label>
  <label>Канал<select id="fCh">
    <option value="all">Все каналы</option>
    <option value="eotinish">e-Otinish</option>
    <option value="1414">1414</option>
  </select></label>
  <label>Филиал<select id="fBr"><option value="all">Все филиалы</option></select></label>
  <div class="note" id="filterNote"></div>
</div>
<nav class="tabs" id="tabs"></nav>
<main>
  <div class="print-header" id="printHeader"></div>
  <section class="tab" id="tab-upload"></section>
  <section class="tab printable" id="tab-overview"></section>
  <section class="tab printable" id="tab-employees"></section>
  <section class="tab printable" id="tab-deadlines"></section>
  <section class="tab printable" id="tab-cons"></section>
  <section class="tab printable" id="tab-services"></section>
  <section class="tab printable" id="tab-recs"></section>
  <section class="tab" id="tab-appeals"></section>
  <section class="tab" id="tab-settings"></section>
</main>
<div id="modal"><div class="box"><header><h2 id="modalTitle" style="margin:0"></h2><button class="btn" id="modalClose">Закрыть</button></header><div class="body" id="modalBody"></div></div></div>
<div id="tip"></div>
<input type="file" id="fileInput" multiple accept=".xlsx,.csv,.txt" hidden>
<input type="file" id="settingsInput" accept=".json,application/json" hidden>

<script>

   Справочники и настройки по умолчанию (PRD, раздел 8.3)

const DEFAULT_SETTINGS = {

    {id:'corruption', name:'Признаки коррупционных проявлений', short:'Коррупция', group:'ethics', weight:5,

    {id:'absence', name:'Отсутствие на рабочем месте, нарушение графика', short:'Отсутствие на месте', group:'ethics', weight:2,

    {id:'refusal', name:'Необоснованный отказ в приёме документов', short:'Отказ в приёме', group:'standard', weight:2,

function detectDelimiter(text) {

  for (const d of [';', '\t', ',']) {

    const freq = {};
    counts.forEach(c => { if (c > 0) freq[c] = (freq[c] || 0) + 1; });
    let score = 0;
    for (const k in freq) score = Math.max(score, freq[k] * 1000 + +k);

async function unzip(buf) {

  const count = dv.getUint16(eocd + 10, true);

  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;

    if (!e) return null;
    const start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);

function matchScore(header, kws) {

  for (const k of kws) if (h.includes(k)) best = Math.max(best, k.length);
  return best;

function detectHeader(rows) {
  const allKw = [...FIELDS, ...WFIELDS].flatMap(f => f.kw);
  let best = -1, bestScore = 0;
  for (let i = 0; i < Math.min(rows.length, 25); i++) {
    const cells = rows[i].filter(c => typeof c === 'string' && c.trim());
    const score = cells.filter(c => c.length < 80 && matchScore(c, allKw) > 0).length;
    if (score > bestScore) { bestScore = score; best = i; }
  }
  if (bestScore >= 2) return best;
  const i = rows.findIndex(r => r.filter(c => cellStr(c)).length >= 2);
  return i < 0 ? 0 : i;
}

  pairs.sort((a, b) => b.s - a.s || a.ci - b.ci);
  const map = {}, used = new Set();

  for (const p of pairs) if (map[p.f] < 0 && !used.has(p.ci)) { map[p.f] = p.ci; used.add(p.ci); }

}

/* =====================================================================
   Классификация (FR-8 … FR-12) и индекс риска (8.4)
   ===================================================================== */
function kwRegex(kws) {
  const parts = (kws || []).map(k => norm(k).trim()).filter(Boolean)
    .map(k => k.split(/\s+/).map(escRe).join('[\\p{L}\\p{N}]*[\\s\\p{P}]+'));
  if (!parts.length) return null;
  // Совпадение только с начала слова; захватываем слово до конца для подсветки
  return new RegExp('(?<![\\p{L}\\p{N}])(?:' + parts.join('|') + ')[\\p{L}\\p{N}]*', 'gu');
}
function compileSettings() {
  const s = S.settings;
  S.compiled = {
    types: s.types.map(t => ({...t, re:kwRegex(t.keywords)})),
    yes: kwRegex(s.confirmYes), no: kwRegex(s.confirmNo)
  };
  S.compiled.byId = Object.fromEntries(S.compiled.types.map(t => [t.id, t]));
}
function classifyAll() {
  compileSettings();
  const C = S.compiled;
  for (const r of S.records) {
    const hay = norm(r.text + ' \n ' + r.service);
    r.v = []; r.hits = {}; r.pv = [];
    for (const t of C.types) {
      if (!t.re) continue;
      const m = hay.match(t.re);
      if (m) {
        r.v.push(t.id); r.hits[t.id] = [...new Set(m)];
        if (t.group !== 'system') r.pv.push(t.id);
      }
    }
    const res = norm(r.result);
    r.confirm = !res ? 'unk' : (C.no && test(C.no, res)) ? 'no' : (C.yes && test(C.yes, res)) ? 'yes' : 'unk';
    let score = 0;
    for (const id of r.pv) score += +C.byId[id].weight || 0;
    r.score = r.confirm === 'yes' ? score * 2 : score;
    r.overdue = false; r.overdueDays = 0;
    if (r.deadline) {
      const end = r.answer || TODAY;
      const diff = dayNum(end) - dayNum(r.deadline);
      if (diff > 0) { r.overdue = true; r.overdueDays = diff; }
    }
    const digits = r.applicant.replace(/\D/g, '');
    r.appKey = digits.length >= 6 ? digits : norm(r.applicant).trim();
  }

}
function test(re, s) { re.lastIndex = 0; return re.test(s); }
function highlight(text) {
  const n = norm(text), spans = [];
  for (const t of S.compiled.types) {
    if (!t.re) continue;
    t.re.lastIndex = 0; let m;
    while ((m = t.re.exec(n))) { spans.push([m.index, m.index + m[0].length, t.name]); if (!m[0].length) t.re.lastIndex++; }
  }
  spans.sort((a, b) => a[0] - b[0]);
  let out = '', pos = 0;
  for (const [a, b, title] of spans) {
    if (a < pos) continue;
    out += esc(text.slice(pos, a)) + '<mark title="' + esc(title) + '">' + esc(text.slice(a, b)) + '</mark>';
    pos = b;
  }
  return out + esc(text.slice(pos));
}

/* =====================================================================

function rebuild() {
  const recs = [], wl = {byMonth:{}, any:{}};
  let id = 0;
  for (const f of S.files) {
    f.used = 0; f.skipped = 0; f.months = {}; f.problems = [];
    if (f.error) continue;
    if (f.type === 'workload') {
      const m = f.wmap;
      if (m.name < 0 || m.count < 0) { f.problems.push('Укажите столбцы «ФИО сотрудника» и «Количество».'); continue; }
      for (const row of f.rows) {
        const name = clean(cellStr(row[m.name])), cnt = parseFloat(cellStr(row[m.count]).replace(/\s/g, '').replace(',', '.'));
        if (!name || !(cnt > 0)) { if (name || cellStr(row[m.count])) f.skipped++; continue; }
        const k = norm(name), mk = m.month >= 0 ? parseMonth(row[m.month]) : null;
        const bucket = mk ? (wl.byMonth[mk] = wl.byMonth[mk] || {}) : wl.any;
        bucket[k] = (bucket[k] || 0) + cnt;
        f.used++;
        if (mk) f.months[mk] = (f.months[mk] || 0) + 1;
      }
      continue;
    }
    const m = f.map;
    if (m.date < 0) f.problems.push('Не указан столбец «Дата поступления» — файл не учитывается.');
    if (m.text < 0) f.problems.push('Не указан столбец «Текст обращения» — файл не учитывается.');
    if (f.problems.length) continue;
    const g = (row, k) => m[k] >= 0 ? cellStr(row[m[k]]) : '';
    for (const row of f.rows) {
      if (!row.some(c => cellStr(c))) continue;
      const d = parseDate(row[m.date]);
      if (!d) { f.skipped++; continue; }
      const src = f.source === 'channel' ? chanToSrc(g(row, 'channel')) : f.source;
      const mk = monthKey(d);
      recs.push({
        id:id++, src, date:d, month:mk, day:d.getDate(),
        text:g(row, 'text'), employee:clean(g(row, 'employee')), con:clean(g(row, 'con')) || (src === '1414' ? 'Контакт-центр 1414' : ''), branch:clean(g(row, 'branch')),
        service:clean(g(row, 'service')), kind:g(row, 'kind'), executor:clean(g(row, 'executor')), status:g(row, 'status'),
        deadline:m.deadline >= 0 ? parseDate(row[m.deadline]) : null, answer:m.answer >= 0 ? parseDate(row[m.answer]) : null,
        result:g(row, 'result'), applicant:g(row, 'applicant'), number:g(row, 'number'), file:f.name
      });
      f.used++; f.months[mk] = (f.months[mk] || 0) + 1;
    }
    if (m.employee < 0) f.problems.push('Нет столбца с сотрудником ЦОН — рейтинг сотрудников по этому файлу будет пуст (анализ только по ЦОН).');
  }
  S.records = recs; S.workload = wl;
  classifyAll();
  refreshFilters();
  renderAll();
}

function filterRecs(month) {

function inc(o, k, n = 1) { o[k] = (o[k] || 0) + n; }
function stats(recs, month) {
  const C = S.compiled;
  const st = {month, total:recs.length, viol:0, ethics:0, standard:0, system:0, confirmed:0, overdue:0,
    repeatAppeals:0, repeatApplicants:0, byType:{}, typeConfirmed:{}, typeNoEmp:{}, byDay:{}, ch:{},
    emp:new Map(), con:new Map(), exe:new Map(), svc:new Map(), recs, repeatKeys:new Set(), noEmp:0};
  const appl = {};
  for (const r of recs) {
    const groups = new Set(r.v.map(id => C.byId[id].group));
    if (r.pv.length) st.viol++;
    if (groups.has('ethics')) st.ethics++;
    if (groups.has('standard')) st.standard++;
    if (groups.has('system')) st.system++;
    if (r.confirm === 'yes' && r.pv.length) st.confirmed++;
    if (r.overdue) st.overdue++;
    inc(st.byDay, r.day); inc(st.ch, r.src);
    for (const id of r.v) {
      inc(st.byType, id);
      if (r.confirm === 'yes') inc(st.typeConfirmed, id);
      if (!r.employee) inc(st.typeNoEmp, id);
    }
    if (r.appKey) inc(appl, r.appKey);
    // сотрудники
    if (r.employee) {
      const k = norm(r.employee);
      let e = st.emp.get(k);
      if (!e) st.emp.set(k, e = {key:k, name:r.employee, n:0, viol:0, ethics:0, standard:0, system:0, confirmed:0, score:0, types:{}, cons:{}, recs:[]});
      e.n++; e.score += r.score; e.recs.push(r); inc(e.cons, r.con || '—');
      if (r.pv.length) e.viol++;
      if (groups.has('ethics')) e.ethics++;
      if (groups.has('standard')) e.standard++;
      if (groups.has('system')) e.system++;
      if (r.confirm === 'yes' && r.pv.length) e.confirmed++;
      for (const id of r.v) inc(e.types, id);
    } else st.noEmp++;
    // ЦОН
    const ck = r.con || 'ЦОН не указан';
    let c = st.con.get(ck);
    if (!c) st.con.set(ck, c = {key:ck, name:ck, n:0, viol:0, ethics:0, standard:0, system:0, confirmed:0, score:0, types:{}, branches:{}, recs:[]});
    c.n++; c.score += r.score; c.recs.push(r); inc(c.branches, r.branch || '—');
    if (r.pv.length) c.viol++;
    if (groups.has('ethics')) c.ethics++;
    if (groups.has('standard')) c.standard++;
    if (groups.has('system')) c.system++;
    if (r.confirm === 'yes' && r.pv.length) c.confirmed++;
    for (const id of r.v) inc(c.types, id);
    // исполнители
    if (r.executor) {
      const xk = norm(r.executor);
      let x = st.exe.get(xk);
      if (!x) st.exe.set(xk, x = {key:xk, name:r.executor, n:0, withDeadline:0, overdue:0, days:0, max:0, recs:[]});
      x.n++; if (r.deadline) x.withDeadline++;
      if (r.overdue) { x.overdue++; x.days += r.overdueDays; x.max = Math.max(x.max, r.overdueDays); x.recs.push(r); }
    }
    // услуги
    const sk = r.service || 'Тематика не указана';
    let s = st.svc.get(sk);
    if (!s) st.svc.set(sk, s = {key:sk, name:sk, n:0, viol:0, ch:{}, recs:[]});
    s.n++; s.recs.push(r); inc(s.ch, r.src); if (r.pv.length) s.viol++;

  return st;
}

/* =====================================================================
   Графики (SVG): горизонтальные столбцы и линии по дням
   ===================================================================== */
function barPath(x, y, w, h, r) {
  if (w <= 0) return '';
  r = Math.min(r, w, h / 2);
  return `M${x},${y}h${w - r}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 ${-r},${r}h${-(w - r)}z`;
}
function hbarChart(items, opts = {}) {
  items = (opts.keepZero ? items : items.filter(i => i.value > 0)).slice(0, opts.max || 10);
  if (!items.length) return '<p class="empty">Нет данных за выбранный период</p>';
  const W = 640, labelW = 236, rowH = 26, barH = 14, padT = 2;
  const plotW = W - labelW - 56, H = items.length * rowH + padT * 2;
  const max = Math.max(...items.map(i => i.value), 1);
  const vf = opts.fmt || fmtInt;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title || '')}">`;
  items.forEach((it, i) => {
    const y = padT + i * rowH, w = it.value > 0 ? Math.max(2, it.value / max * plotW) : 0;
    s += `<g class="bar-row" data-tip="${esc(it.tip || it.label + ': ' + vf(it.value))}"${it.click ? ` data-click="${esc(it.click)}"` : ''}>`
      + `<rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}" rx="4"/>`
      + `<text x="${labelW - 8}" y="${y + rowH / 2}" text-anchor="end" dominant-baseline="central">${esc(trunc(it.label, 36))}</text>`
      + `<path d="${barPath(labelW, y + (rowH - barH) / 2, w, barH, 4)}" fill="${it.color || 'var(--s-standard)'}"/>`
      + `<text class="val" x="${labelW + w + 6}" y="${y + rowH / 2}" dominant-baseline="central">${vf(it.value)}</text></g>`;
  });
  return s + '</svg>';
}
function niceMax(v) {
  if (v <= 4) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function lineChart(cur, prev, curKey, prevKey) {
  const days = Math.max(daysInMonth(curKey), prevKey ? daysInMonth(prevKey) : 0);
  const W = 640, H = 230, L = 40, R = 12, T = 12, B = 28;
  const vals = []; for (let d = 1; d <= days; d++) vals.push(cur[d] || 0, prev[d] || 0);
  const ymax = niceMax(Math.max(...vals, 1));
  const x = d => L + (d - 1) / (days - 1) * (W - L - R), y = v => T + (1 - v / ymax) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Обращения по дням">`;
  for (let i = 0; i <= 4; i++) {
    const v = ymax / 4 * i;
    s += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v)}" text-anchor="end" dominant-baseline="central">${fmtInt(v)}</text>`;
  }
  for (let d = 1; d <= days; d++) if (d === 1 || d % 5 === 0) s += `<text class="axis" x="${x(d)}" y="${H - 8}" text-anchor="middle">${d}</text>`;
  for (let d = 1; d <= days; d++) {
    const w = (W - L - R) / (days - 1);
    s += `<rect class="day-hit" x="${x(d) - w / 2}" y="${T}" width="${w}" height="${H - T - B}" fill="transparent" data-tip="${d}-е число\n${monthLabel(curKey)}: ${fmtInt(cur[d] || 0)}${prevKey ? '\n' + monthLabel(prevKey) + ': ' + fmtInt(prev[d] || 0) : ''}"/>`;
  }
  const path = (src, n) => { let p = ''; for (let d = 1; d <= n; d++) p += (d === 1 ? 'M' : 'L') + x(d).toFixed(1) + ',' + y(src[d] || 0).toFixed(1); return p; };
  if (prevKey) s += `<path d="${path(prev, daysInMonth(prevKey))}" fill="none" stroke="var(--prev)" stroke-width="2" stroke-dasharray="5 4" pointer-events="none"/>`;

  return s + '</svg>';
}

function sampleOf(f, ci, key) {
  for (const r of f.rows.slice(0, 200)) {

async function handleFiles(list) {
  for (const file of list) {
    const f = {id:Math.random().toString(36).slice(2), name:file.name, rows:[], headers:[], map:{}, wmap:{}, headerIdx:0, type:'appeals', source:'eotinish'};
    try {
      const buf = await file.arrayBuffer();
      const isZip = new Uint8Array(buf.slice(0, 2)).every((b, i) => b === [0x50, 0x4b][i]);
      let rows;
      if (/\.xlsx$/i.test(file.name) || isZip) rows = await readXlsx(buf);
      else if (/\.xls$/i.test(file.name)) throw new Error('Формат .xls (Excel 97–2003) не поддерживается — сохраните файл как .xlsx или .csv');
      else rows = parseCSV(decodeText(buf));
      if (!rows.length) throw new Error('Файл пуст');
      setupFile(f, rows);
    } catch (e) { f.error = 'Не удалось прочитать файл: ' + e.message; }
    S.files.push(f);
  }
  rebuild();
}

function employeeRows() {

function dynText(c, p, ph) {
  if (!ph) return 'нет данных за прошлый месяц';
  if (!p) return 'в прошлом месяце не было';
  const d = c - p;
  return `в прошлом месяце ${p}, ${d === 0 ? 'без изменений' : signed(d) + ' (' + signed(Math.round(d / p * 100)) + '%)'}`;
}
function generateRecs() {
  const {cur, prev} = current(), ph = prev.hasData, C = S.compiled, s = S.settings;
  const due = days => fmtDate(addDays(TODAY, +days || 0));
  const rows = [];
  const types = C.types.filter(t => cur.byType[t.id]).sort((a, b) => (cur.byType[b.id] - cur.byType[a.id]));
  for (const t of types) {
    const c = cur.byType[t.id], p = prev.byType[t.id] || 0;
    const cons = [...cur.con.values()].filter(x => x.types[t.id]).sort((a, b) => b.types[t.id] - a.types[t.id]);
    const emps = [...cur.emp.values()].filter(x => x.types[t.id]).sort((a, b) => b.types[t.id] - a.types[t.id]).slice(0, 3);
    const noEmp = cur.typeNoEmp[t.id] || 0;
    let who;
    if (t.group === 'system') who = 'Персональная вина не устанавливается — системная проблема';
    else {
      who = emps.length ? emps.map(e => `${e.name} (${e.types[t.id]})`).join(', ') + ' — предварительно, до проверки' : 'Установить в ходе проверки';
      if (emps.length && noEmp) who += `; по ${noEmp} обращ. сотрудник не указан — установить в ходе проверки`;
    }
    rows.push({problem:`${t.name} (${GROUPS[t.group]?.label || ''})`,
      basis:`${c} ${plural(c, 'обращение', 'обращения', 'обращений')}; ${dynText(c, p, ph)}; подтверждено проверкой: ${cur.typeConfirmed[t.id] || 0}${cons[0] ? `; больше всего — ${cons[0].name} (${cons[0].types[t.id]})` : ''}`,
      who, measures:t.measures, resp:t.responsible, due:due(t.days), status:'Новая'});
  }
  if (cur.overdue) {
    const o = s.overdue, exes = [...cur.exe.values()].filter(x => x.overdue).sort((a, b) => b.overdue - a.overdue).slice(0, 3);
    rows.push({problem:o.name, basis:`${cur.overdue} просроч. ${plural(cur.overdue, 'обращение', 'обращения', 'обращений')}; ${dynText(cur.overdue, prev.overdue, ph)}`,
      who:exes.length ? exes.map(x => `${x.name} (${x.overdue})`).join(', ') + ' — исполнители обращений, предварительно' : 'Установить в ходе проверки (исполнитель не указан)',
      measures:o.measures, resp:o.responsible, due:due(o.days), status:'Новая'});
  }
  for (const sv of serviceGrowth(cur, prev)) {
    const g = s.growth;
    rows.push({problem:`Рост обращений по услуге «${sv.name}»`, basis:`${sv.n} обращений против ${sv.prev} в прошлом месяце (${isFinite(sv.growth) ? '+' + Math.round(sv.growth) + '%' : 'новая тематика'}); с нарушениями: ${sv.viol}`,
      who:'Персональная вина не установлена — требуется анализ причин', measures:g.measures, resp:g.responsible, due:due(g.days), status:'Новая'});
  }
  if (cur.repeatApplicants) {
    const rp = s.repeat, byCon = {};
    cur.recs.filter(r => cur.repeatKeys.has(r.appKey)).forEach(r => inc(byCon, r.con || 'ЦОН не указан'));
    const top = Object.entries(byCon).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k, n]) => `${k} (${n})`).join(', ');
    rows.push({problem:'Повторные обращения', basis:`${cur.repeatAppeals} обращений от ${cur.repeatApplicants} ${plural(cur.repeatApplicants, 'заявителя', 'заявителей', 'заявителей')}; ${dynText(cur.repeatAppeals, prev.repeatAppeals, ph)}`,
      who:`Установить в ходе проверки; больше всего повторных: ${top}`, measures:rp.measures, resp:rp.responsible, due:due(rp.days), status:'Новая'});
  }
  return rows;
}

function bind() {
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { S.tab = b.dataset.tab; renderTabs(); window.scrollTo(0, 0); } });
  $('#fMonth').addEventListener('change', e => { S.filter.month = e.target.value; S.ui.apLimit = 300; renderFiltered(); });
  $('#fCh').addEventListener('change', e => { S.filter.ch = e.target.value; S.ui.apLimit = 300; renderFiltered(); });
  $('#fBr').addEventListener('change', e => { S.filter.br = e.target.value; S.ui.apLimit = 300; renderFiltered(); });
  $('#btnPrint').addEventListener('click', printReport);
  $('#btnDemo').addEventListener('click', () => {
    if (S.files.length && !confirm('Заменить загруженные файлы демо-данными?')) return;
    S.files = makeDemo().map(d => { const f = {id:d.name, name:d.name}; setupFile(f, d.rows); return f; });
    S.recs = {};
    rebuild(); S.tab = 'overview'; renderTabs();
  });
  $('#modalClose').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Загрузка файлов (FR-1)
  const fi = $('#fileInput');
  fi.addEventListener('change', () => { handleFiles([...fi.files]); fi.value = ''; });
  const up = $('#tab-upload');
  up.addEventListener('click', e => {
    if (e.target.closest('#drop')) fi.click();
    const rm = e.target.closest('[data-remove]');
    if (rm) { S.files.splice(+rm.dataset.remove, 1); rebuild(); }
  });
  up.addEventListener('dragover', e => { e.preventDefault(); $('#drop')?.classList.add('over'); });
  up.addEventListener('dragleave', e => { if (e.target.id === 'drop') e.target.classList.remove('over'); });
  up.addEventListener('drop', e => { e.preventDefault(); $('#drop')?.classList.remove('over'); handleFiles([...e.dataTransfer.files]); });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => { if (!e.target.closest('#tab-upload')) { e.preventDefault(); if (e.dataTransfer.files.length) { S.tab = 'upload'; renderTabs(); handleFiles([...e.dataTransfer.files]); } } });
  up.addEventListener('change', e => {
    const t = e.target, d = t.dataset;
    if (d.ftype != null) { S.files[+d.ftype].type = t.value; }
    else if (d.fsrc != null) { S.files[+d.fsrc].source = t.value; }
    else if (d.fhead != null) { const f = S.files[+d.fhead]; const v = Math.max(1, Math.min(f.raw.length, +t.value || 1)); applyHeaderRow(f, v - 1); }
    else if (d.fmap != null) { const f = S.files[+d.fmap]; (f.type === 'workload' ? f.wmap : f.map)[d.field] = +t.value; }
    else return;
    rebuild();
  });

  // Клики по строкам и графикам
  document.addEventListener('click', e => {
    const tx = e.target.closest('.txt.clamp, .txt.open');
    if (tx) { tx.classList.toggle('clamp'); tx.classList.toggle('open'); return; }
    const c = e.target.closest('[data-click]');
    if (!c) return;
    const [kind, ...rest] = c.dataset.click.split('|'), key = rest.join('|');
    const {cur} = current();
    if (kind === 'emp') { const x = cur.emp.get(key); if (x) openList(`${x.name} — обращения за ${monthLabel(cur.month)}`, x.recs, `Индекс риска: ${x.score}. Сведения предварительные — до проверки.`); }
    if (kind === 'con') { const x = cur.con.get(key); if (x) openList(`${x.name} — обращения за ${monthLabel(cur.month)}`, x.recs); }
    if (kind === 'exe') { const x = cur.exe.get(key); if (x) openList(`${x.name} — просроченные обращения`, x.recs); }
    if (kind === 'svc') { const x = cur.svc.get(key); if (x) openList(`${x.name} — обращения за ${monthLabel(cur.month)}`, x.recs); }
    if (kind === 'type') { const t = S.compiled.byId[key]; openList(`${t.name} — ${monthLabel(cur.month)}`, cur.recs.filter(r => r.v.includes(key))); }
  });

  // Сотрудники
  const emp = $('#tab-employees');
  emp.addEventListener('input', e => { if (e.target.id === 'empSearch') { S.ui.empSearch = e.target.value; const pos = e.target.selectionStart; renderEmployees(); const i = $('#empSearch'); i.focus(); i.setSelectionRange(pos, pos); } });
  emp.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'empGroup') S.ui.empGroup = t.value;
    else if (t.id === 'empOrder') S.ui.empOrder = t.value;
    else if (t.dataset.empChart != null) S.ui.empCharts[+t.dataset.empChart] = t.value;
    else return;
    renderEmployees();
  });
  emp.addEventListener('click', e => {
    const th = e.target.closest('[data-sort]');
    if (th) { const k = th.dataset.sort; S.ui.empDir = S.ui.empSort === k ? -S.ui.empDir : (k === 'name' ? 1 : -1); S.ui.empSort = k; renderEmployees(); }
    if (e.target.id === 'empCsv') exportEmployees();
  });
  $('#tab-cons').addEventListener('click', e => { if (e.target.id === 'conCsv') exportCons(); });

  // Обращения
  const ap = $('#tab-appeals');
  let apTimer;
  ap.addEventListener('input', e => { if (e.target.id === 'apSearch') { S.ui.apSearch = e.target.value; clearTimeout(apTimer); apTimer = setTimeout(() => { const pos = e.target.selectionStart; S.ui.apLimit = 300; renderAppeals(); const i = $('#apSearch'); i.focus(); i.setSelectionRange(pos, pos); }, 200); } });
  ap.addEventListener('change', e => { if (e.target.id === 'apType') { S.ui.apType = e.target.value; S.ui.apLimit = 300; renderAppeals(); } });
  ap.addEventListener('click', e => { if (e.target.id === 'apMore') { S.ui.apLimit += 300; renderAppeals(); } if (e.target.id === 'apCsv') exportAppeals(); });

  // Рекомендации
  const rc = $('#tab-recs');
  rc.addEventListener('input', e => { const d = e.target.dataset; if (d.rec != null) { const st = recState(); st.rows[+d.rec][d.f] = e.target.innerText.trim(); st.edited = true; } });
  rc.addEventListener('change', e => { const d = e.target.dataset; if (d.recStatus != null) { const st = recState(); st.rows[+d.recStatus].status = e.target.value; st.edited = true; e.target.nextElementSibling.textContent = e.target.value; } });
  rc.addEventListener('click', e => {
    const st = recState();
    if (e.target.id === 'recAdd') { st.rows.push({problem:'', basis:'', who:'', measures:'', resp:'', due:'', status:'Новая'}); st.edited = true; renderRecs(); }
    if (e.target.id === 'recRegen') { if (!st.edited || confirm('Сформировать таблицу заново? Ручные правки будут потеряны.')) { recState(true); renderRecs(); } }
    if (e.target.id === 'recCsv') exportRecs();
    const del = e.target.closest('[data-rec-del]');
    if (del && confirm('Удалить строку рекомендации?')) { st.rows.splice(+del.dataset.recDel, 1); st.edited = true; renderRecs(); }
  });

  // Настройки
  const se = $('#tab-settings');
  se.addEventListener('change', e => {
    const t = e.target, d = t.dataset, s = S.settings;
    if (d.t != null) {
      const ty = s.types[+d.t];
      if (d.f === 'keywords') ty.keywords = splitList(t.value);
      else if (d.f === 'weight' || d.f === 'days') ty[d.f] = Math.max(0, +t.value || 0);
      else ty[d.f] = t.value;
      if (d.f === 'group') renderSettings();
    } else if (d.o) s[d.o][d.f] = (d.f === 'days' || d.f === 'pct' || d.f === 'min') ? Math.max(0, +t.value || 0) : t.value;
    else if (d.list) s[d.list] = splitList(t.value);
    else return;
    onSettingsChanged();
  });
  se.addEventListener('click', e => {
    const id = e.target.id;
    if (id === 'setSave') download('словари_и_веса_ЦОН.json', new Blob([JSON.stringify(S.settings, null, 2)], {type:'application/json'}));
    if (id === 'setLoad') $('#settingsInput').click();
    if (id === 'setAdd') { S.settings.types.push({id:'custom_' + Date.now(), name:'Новый вид нарушения', short:'Новый', group:'standard', weight:1, responsible:'', days:15, keywords:[], measures:''}); renderSettings(); onSettingsChanged(); }
    if (id === 'setReset' && confirm('Вернуть исходные словари и веса? Текущие настройки будут потеряны.')) { S.settings = structuredClone(DEFAULT_SETTINGS); renderSettings(); onSettingsChanged(); }
    const del = e.target.closest('[data-tdel]');
    if (del && confirm('Удалить вид нарушения «' + S.settings.types[+del.dataset.tdel].name + '»?')) { S.settings.types.splice(+del.dataset.tdel, 1); renderSettings(); onSettingsChanged(); }
  });
  $('#settingsInput').addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const s = JSON.parse(await file.text());
      if (!s || !Array.isArray(s.types)) throw new Error('нет списка видов нарушений');
      s.types.forEach((t, i) => { t.id = t.id || 'custom_' + i; t.keywords = Array.isArray(t.keywords) ? t.keywords : splitList(String(t.keywords || '')); });
      S.settings = mergeSettings(s); renderSettings(); onSettingsChanged();
    } catch (err) { alert('Не удалось загрузить настройки: ' + err.message); }
  });

  // Всплывающие подсказки
  const tip = $('#tip');
  document.addEventListener('mousemove', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.style.display = 'none'; return; }
    tip.textContent = t.getAttribute('data-tip'); tip.style.display = 'block';
    const w = tip.offsetWidth, hgt = tip.offsetHeight;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + 'px';
    tip.style.top = (e.clientY + 14 + hgt > innerHeight ? e.clientY - hgt - 10 : e.clientY + 14) + 'px';
  });
  window.addEventListener('beforeprint', () => { tip.style.display = 'none'; });
}

/* =====================================================================
   Демо-данные (синтетические, детерминированные)
   ===================================================================== */
function makeDemo() {
  let seed = 20261002;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)], ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const wpick = obj => { const tot = Object.values(obj).reduce((a, b) => a + b, 0); let x = rnd() * tot; for (const k in obj) { x -= obj[k]; if (x <= 0) return k; } return Object.keys(obj)[0]; };
  const cm = prevMonthKey(monthKey(TODAY)), pm = prevMonthKey(cm);
  const dt = (d, withTime) => fmtDate(d) + (withTime ? ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) : '');
  const BR = [
    {name:'Филиал по г. Астана', cons:{'ЦОН Алматинского района':['Ахметова А.С.', 'Бекова Д.М.', 'Жумабеков Е.К.', 'Иванова О.П.'], 'ЦОН Есильского района':['Касымов Р.Т.', 'Нурланова Г.Б.', 'Петров В.А.'], 'ЦОН Сарыаркинского района':['Сагинтаева М.Н.', 'Тулегенов А.Ж.', 'Уразова К.Р.']}},
    {name:'Филиал по Карагандинской области', cons:{'ЦОН района Казыбек би':['Федоров И.С.', 'Хасенова Л.А.', 'Шаяхметов Б.О.'], 'ЦОН г. Темиртау':['Ергалиева Н.К.', 'Мухамеджанов Т.Б.', 'Сейтова А.Е.']}}
  ];
  const OPS = ['Абдрахманова Ж.К.', 'Голубева Е.В.', 'Даулетов С.М.', 'Исмаилова А.Р.', 'Кенжебаев Н.А.', 'Литвинова Т.С.'];
  const RISK = {'Жумабеков Е.К.':4, 'Касымов Р.Т.':3, 'Шаяхметов Б.О.':3.5, 'Уразова К.Р.':2, 'Кенжебаев Н.А.':3, 'Мухамеджанов Т.Б.':2.5};
  const EXE = {'Сейткали А.М.':0.05, 'Рахимова Е.В.':0.1, 'Ли Д.С.':0.45};
  const SVC = ['Регистрация по месту жительства', 'Выдача удостоверения личности', 'Регистрация транспортных средств', 'Назначение пособий', 'Справка о несудимости', 'Регистрация недвижимости', 'Пенсионные выплаты', 'Получение ЭЦП'];
  const T = {
    neutral:['Прошу разъяснить порядок получения услуги «{s}».', 'Прошу сообщить статус моей заявки по услуге «{s}».', 'Выражаю благодарность сотруднику за вежливое и быстрое обслуживание.', 'Прошу предоставить перечень документов для услуги «{s}».', 'Хочу уточнить график работы ЦОН в праздничные дни.', 'Прошу выдать дубликат документа взамен утерянного.', 'Заявление на получение услуги «{s}» через портал, прошу помочь с подачей.'],
    rude:['Сотрудник грубо разговаривал со мной и повысил голос при других посетителях.', 'Оператор нагрубила, вела себя неуважительно, отказалась представиться.', 'Хамское отношение сотрудника в окне №{n}, прошу принять меры.', 'Сотрудница бросила документы на стол и сказала, что ей некогда.'],
    corruption:['Сотрудник намекнул, что за деньги может оформить быстрее и без очереди.', 'Требовали деньги за ускорение выдачи документов, считаю это вымогательством.', 'Возле ЦОН посредник предлагает купить талон, сотрудники в курсе.'],
    absence:['Окно №{n} было закрыто 40 минут, сотрудника не было на месте.', 'Сотрудник ушла на обед раньше времени, люди ждали.', 'Оператор долго разговаривал по телефону на личные темы, не обслуживая граждан.', 'Сотрудник опоздал на работу на час, приём начался позже.'],
    refusal:['Мне отказали в приёме документов без объяснения причин, хотя все документы были.', 'Не приняли документы, сказали прийти завтра.', 'Сотрудник отказался принять заявление, сославшись на отсутствие времени.'],
    extradocs:['Требовали дополнительные справки, которых нет в стандарте услуги «{s}».', 'Потребовали принести лишние документы, не предусмотренные стандартом.', 'Сотрудник требовал справку с места работы, хотя для услуги она не нужна.'],
    wait:['Простоял в очереди более двух часов, работало одно окно.', 'Невозможно дозвониться до 1414, линия занята по 30 минут.', 'Долго ждала ответа оператора, висела на линии 25 минут.', 'Огромные очереди в ЦОН, ожидание по 3 часа.'],
    resultdelay:['Результат по услуге «{s}» до сих пор не готов, срок выдачи нарушен.', 'Задерживают выдачу документа уже две недели.', 'Документы не выдали в установленный срок, жду результат уже месяц.'],
    consult:['Оператор дал неверную консультацию, из-за этого я потерял время.', 'Сотрудник некомпетентен, не смог объяснить порядок получения услуги.', 'В 1414 предоставили неправильную информацию о сроках оказания услуги.', 'Разные сотрудники дают разную информацию, отправляют из окна в окно.'],
    docerrors:['В справке допущена ошибка в фамилии, пришлось приходить повторно.', 'Неверно указаны данные в заявлении, сотрудник перепутал дату рождения.', 'В документе опечатка в номере, прошу исправить.'],
    tech:['В ЦОН был сбой системы, документы не принимали весь день.', 'Не работает ЭЦП, система зависла при подаче заявления.', 'Программа не работала, сотрудники сказали ждать до завтра.']
  };
  const fill = (s, svc) => s.replace('{s}', svc).replace('{n}', ri(1, 12));
  const pool = Array.from({length:20000}, () => String(ri(500000, 999999)) + String(ri(100000, 999999)));
  const repeaters = pool.slice(0, 15);
  const eo = [['Выгрузка обращений ИС e-Otinish за период ' + monthLabel(pm) + ' – ' + monthLabel(cm)], [],
    ['№ обращения', 'Дата поступления', 'Вид обращения', 'Филиал', 'ЦОН', 'Сотрудник ЦОН', 'Госуслуга', 'Текст обращения', 'Исполнитель', 'Статус', 'Контрольный срок', 'Дата ответа', 'Результат рассмотрения', 'ИИН заявителя']];
  const cc = [['№ п/п', 'Дата и время звонка', 'Номер телефона', 'Регион', 'Оператор', 'Тематика обращения', 'Суть обращения', 'Результат']];
  let num = 1000, ccn = 1;
  for (const mk of [pm, cm]) {
    const [y, m] = mk.split('-').map(Number), dim = daysInMonth(mk), late = mk === cm;
    for (let i = 0; i < (late ? 330 : 300); i++) {
      const b = pick(BR), con = pick(Object.keys(b.cons)), emp = rnd() < 0.86 ? pick(b.cons[con]) : '';
      const risk = RISK[emp] ? RISK[emp] * (late && emp === 'Жумабеков Е.К.' ? 1.4 : 1) : 1;
      let svc = pick(SVC), cat = 'neutral';
      if (late && rnd() < 0.09) { cat = 'tech'; svc = 'Получение ЭЦП'; }
      else if (rnd() < 0.3 * Math.min(risk, 2.6)) cat = wpick(risk > 1.5 ? {rude:5, corruption:0.8, absence:3, refusal:3, extradocs:2, wait:2, resultdelay:2, consult:3, docerrors:2, tech:0.5} : {rude:1, corruption:0.2, absence:1, refusal:2, extradocs:2, wait:5, resultdelay:3, consult:3, docerrors:2, tech:1.5});
      let text = fill(pick(T[cat]), svc);
      if (cat !== 'neutral' && cat !== 'tech' && rnd() < 0.3) text += ' ' + fill(pick(T[pick(['wait', 'consult', 'docerrors'])]), svc);
      const d = new Date(y, m - 1, ri(1, dim), ri(9, 18), ri(0, 59));
      const exe = wpick({'Сейткали А.М.':3, 'Рахимова Е.В.':3, 'Ли Д.С.':2});
      const dl = addDays(d, 15);
      let ans = rnd() < EXE[exe] ? addDays(d, ri(16, 30)) : addDays(d, ri(2, 14));
      if (rnd() < 0.05) ans = null;
      if (ans && ans > TODAY) ans = null;
      const res = !ans ? '' : cat === 'neutral' ? 'Разъяснено' : cat === 'tech' ? 'Обоснованная, приняты меры' : rnd() < 0.22 * risk ? 'Обоснованная, приняты меры' : rnd() < 0.6 ? 'Необоснованная' : 'Разъяснено';
      const inn = rnd() < 0.08 ? pick(repeaters) : pick(pool);
      eo.push(['ЖТ-' + (num++), dt(d, true), cat === 'neutral' ? pick(['Заявление', 'Запрос', 'Жалоба']) : 'Жалоба', b.name, con, emp, svc, text, exe,
        ans ? 'Исполнено' : 'На рассмотрении', fmtDate(dl), ans ? fmtDate(ans) : '', res, inn]);
    }
    for (let i = 0; i < (late ? 520 : 480); i++) {
      const op = pick(OPS), risk = RISK[op] || 1;
      let svc = pick(SVC), cat = 'neutral';
      if (late && rnd() < 0.06) { cat = 'tech'; svc = 'Получение ЭЦП'; }
      else if (rnd() < 0.22 * risk) cat = wpick({rude:risk > 1.5 ? 4 : 1, wait:5, consult:5, resultdelay:1});
      const d = new Date(y, m - 1, ri(1, dim), ri(8, 20), ri(0, 59));
      cc.push([ccn++, dt(d, true), '+7 7' + (rnd() < 0.08 ? pick(repeaters).slice(0, 9) : pick(pool).slice(0, 9)), pick(BR).name, op, svc, fill(pick(T[cat]), svc),
        cat === 'neutral' ? 'Консультация предоставлена' : pick(['Передано руководителю смены', 'Обоснованная, приняты меры', 'Необоснованная', 'Консультация предоставлена'])]);
    }
  }
  const wl = [['ФИО сотрудника', 'Количество обслуженных граждан / звонков']];
  BR.forEach(b => Object.values(b.cons).flat().forEach(n => wl.push([n, ri(600, 1500)])));
  OPS.forEach(n => wl.push([n, ri(900, 1600)]));
  return [{name:'демо_e-Otinish.xlsx', rows:eo}, {name:'демо_1414.csv', rows:cc}, {name:'демо_нагрузка.csv', rows:wl}];
}

/* ===================================================================== */
S.settings = loadSettings();
compileSettings();
bind();
renderAll();
</script>
